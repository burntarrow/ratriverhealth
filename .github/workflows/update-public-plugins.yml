name: Update public plugins

on:
  push:
    branches:
      - php-8.4-compat
    paths:
      - .github/workflows/update-public-plugins.yml
      - tools/update-public-plugins.sh

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v5
        with:
          ref: php-8.4-compat
          fetch-depth: 1

      - name: Install current public plugin releases
        shell: bash
        run: bash tools/update-public-plugins.sh

      - name: Commit plugin updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Public plugins are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update public plugins for WordPress 7.1 and PHP 8.4'
          git push origin HEAD:php-8.4-compat
