name: PHP 8.4 compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - php-8.4-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: php84-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Report runtime versions
        shell: bash
        run: |
          php --version
          php -r 'require "wp-includes/version.php"; echo "WordPress {$wp_version}\n";'

      - name: Verify WordPress core supports PHP 8.4
        shell: bash
        run: |
          php -r '
            require "wp-includes/version.php";
            if (version_compare($wp_version, "6.7", "<")) {
                fwrite(STDERR, "WordPress {$wp_version} is too old for supported PHP 8.4 operation.\n");
                exit(1);
            }
          '

      - name: Lint site PHP with PHP 8.4 diagnostics
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            set +e
            output=$(php \
              -d error_reporting=E_ALL \
              -d display_errors=1 \
              -d short_open_tag=0 \
              -l "$file" 2>&1)
            result=$?
            set -e

            if [ "$result" -ne 0 ] || printf '%s' "$output" | grep -Eq '(^|[[:space:]])(Deprecated|Warning|Fatal error|Parse error|Notice):'; then
              printf '\n%s\n%s\n' "$file" "$output"
              status=1
            fi
          done < <(
            find \
              wp-config.php \
              wp-config.local.example.php \
              wp-content/themes/the-cause \
              wp-content/plugins \
              tools \
              -type f -name '*.php' -print0
          )
          exit "$status"

      - name: Scan for removed PHP APIs
        shell: bash
        run: php tools/scan-removed-php-apis.php

      - name: Scan for legacy PHP short tags
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if grep -nP '<\?(?!php\b|=|xml\b)' "$file"; then
              echo "Legacy short tag found in $file"
              status=1
            fi
          done < <(
            find wp-content/themes/the-cause wp-content/plugins \
              -type f -name '*.php' -print0
          )
          exit "$status"

      - name: Install PHPCompatibility tooling
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/phpcompat
          cd /tmp/phpcompat
          composer init --no-interaction --name=ratriverhealth/phpcompat
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require --dev --no-interaction \
            squizlabs/php_codesniffer \
            dealerdirect/phpcodesniffer-composer-installer \
            phpcompatibility/php-compatibility \
            phpcompatibility/phpcompatibility-wp

      - name: Run PHPCompatibilityWP on custom code
        continue-on-error: true
        shell: bash
        run: |
          if [ -x /tmp/phpcompat/vendor/bin/phpcs ]; then
            /tmp/phpcompat/vendor/bin/phpcs \
              -p -s \
              --standard=PHPCompatibilityWP \
              --runtime-set testVersion 8.4- \
              --extensions=php \
              wp-content/themes/the-cause \
              wp-content/plugins/rat_river_widgets
          fi
