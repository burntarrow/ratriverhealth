name: Modernize legacy theme widgets

on:
  push:
    branches:
      - php-8.4-compat
    paths:
      - .github/workflows/modernize-theme-widgets.yml
      - tools/modernize-legacy-widgets.php

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v5
        with:
          ref: php-8.4-compat
          fetch-depth: 1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Modernize widget constructors and registration
        shell: bash
        run: php tools/modernize-legacy-widgets.php

      - name: Lint modernized widgets
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find wp-content/themes/the-cause/includes/widgets -type f -name '*.php' -print0)
          exit "$status"

      - name: Commit theme widget changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Theme widgets are already modernized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/themes/the-cause/includes/widgets
          git commit -m 'Modernize legacy theme widgets for PHP 8.4'
          git push origin HEAD:php-8.4-compat
